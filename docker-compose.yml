services:
  db:
    image: postgres:17
    container_name: rick-commerce-db
    environment:
      POSTGRES_USER: rickcommerce
      POSTGRES_PASSWORD: rickcommerce
      POSTGRES_DB: rickcommerce_db
    ports:
      - "5432:5432"
    volumes:
      - rickcommerce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rickcommerce -d rickcommerce_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rickcommerce_pgdata:
